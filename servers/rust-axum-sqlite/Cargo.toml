[package]
name = "xitdb-bench-rust-sqlite"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xitdb-bench-rust-sqlite"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
