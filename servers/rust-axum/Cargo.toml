[package]
name = "xitdb-bench-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xitdb-bench-rust"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
xitdb = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "10"
chrono = "0.4"
