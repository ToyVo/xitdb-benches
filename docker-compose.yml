# M1: services run directly on the host via harness/run.sh (see README).
# Container images land in M2: rust-axum's xitdb dep is a local path dep
# (unpublished), so no Dockerfile can build it in isolation yet. Until
# then every service sits behind the `m2` profile: plain
# `docker compose up` starts nothing; `--profile m2` fails at build
# until the M2 Dockerfiles exist. Port map (contracts.sh greps these):
# rust 3001, go 3002, ts 3003, zig 3004, clj 3005, odin 3006, java 3007.
# sqlite twins: rust 3008, go 3009, ts 3010, zig 3011, clj 3012, odin 3013, java 3014.
services:
  rust-axum:
    profiles: [m2]
    build: ./servers/rust-axum
    ports: ["3001:3000"]
    environment: [HOST=0.0.0.0, PORT=3000]
  go-std:
    profiles: [m2]
    build: ./servers/go-std
    ports: ["3002:3000"]
  ts-bun:
    profiles: [m2]
    build: ./servers/ts-bun
    ports: ["3003:3000"]
  zig-std:
    profiles: [m2]
    build: ./servers/zig-std
    ports: ["3004:3000"]
  clj-httpkit:
    profiles: [m2]
    build: ./servers/clj-httpkit
    ports: ["3005:3000"]
  odin-std:
    profiles: [m2]
    build: ./servers/odin-std
    ports: ["3006:3000"]
  java-spring:
    profiles: [m2]
    build: ./servers/java-spring
    ports: ["3007:3000"]
  rust-axum-sqlite:
    profiles: [m2]
    build: ./servers/rust-axum-sqlite
    ports: ["3008:3000"]
    environment: [HOST=0.0.0.0, PORT=3000]
  go-std-sqlite:
    profiles: [m2]
    build: ./servers/go-std-sqlite
    ports: ["3009:3000"]
  ts-bun-sqlite:
    profiles: [m2]
    build: ./servers/ts-bun-sqlite
    ports: ["3010:3000"]
  zig-std-sqlite:
    profiles: [m2]
    build: ./servers/zig-std-sqlite
    ports: ["3011:3000"]
  clj-httpkit-sqlite:
    profiles: [m2]
    build: ./servers/clj-httpkit-sqlite
    ports: ["3012:3000"]
  odin-std-sqlite:
    profiles: [m2]
    build: ./servers/odin-std-sqlite
    ports: ["3013:3000"]
  java-spring-sqlite:
    profiles: [m2]
    build: ./servers/java-spring-sqlite
    ports: ["3014:3000"]
  # nginx (optional, mirrors bench/nginx.conf, 64 idle conns):
  # nginx:
  #   image: nginx:stable
  #   volumes: [./harness/bench/nginx.conf:/etc/nginx/nginx.conf:ro]
  #   ports: ["3000:3000"]
