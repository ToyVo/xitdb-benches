name: ci
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      size:
        description: "seed size (small|full)"
        default: small

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash harness/contracts.sh

  rust-axum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - run: cd seed && bun install
      - run: bash harness/run.sh servers/rust-axum
        env:
          SIZE: ${{ inputs.size || 'small' }}
