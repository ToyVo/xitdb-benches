name: ci
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      size:
        description: "seed size (small|full)"
        default: small

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash harness/contracts.sh

  rust-axum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - run: cd seed && bun install
      - run: bash harness/run.sh servers/rust-axum
        env:
          SIZE: ${{ inputs.size || 'small' }}

  go-std:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: cd seed && bun install
      - run: bash harness/run.sh servers/go-std
        env:
          SIZE: ${{ inputs.size || 'small' }}

  ts-bun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: cd seed && bun install
      - run: bash harness/run.sh servers/ts-bun
        env:
          SIZE: ${{ inputs.size || 'small' }}

  zig-std:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: cd seed && bun install
      - run: bash harness/run.sh servers/zig-std
        env:
          SIZE: ${{ inputs.size || 'small' }}
